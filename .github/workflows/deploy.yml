name: Deploy to Cloudflare

# Builds on PRs (so we can see it compiles before merging, e.g. Dependabot bumps)
# and on push to main; only main actually deploys, as a static-assets Worker to
# https://motojourney.migueljfsc.dev.
#
# WHY WRANGLER AND NOT OPENTOFU. Deploying static assets is an upload of file hashes that ends
# in a completion token Cloudflare expires after an hour; Terraform can neither produce it nor
# hold it in state. Everything around the site is OpenTofu, applied by terraform.yml.
#
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (permissions in infrastructure/terraform/cloudflare/README.md).
on:
  push:
    branches: [main]
    paths: &build-paths
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths: *build-paths
  workflow_dispatch:

permissions:
  contents: read

# Don't let PR builds and the main deploy block each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # PRs build only — never deploy. npx, not wrangler-action: the action `pnpm add`s wrangler
      # into the project, and pnpm refuses workerd's install script, which is not on this
      # repo's allowBuilds list. A pinned npx run adds nothing to the project.
      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npx --yes wrangler@4.131.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
